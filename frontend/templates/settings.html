{% extends "base.html" %}
{% block title %}Settings | SkillSwap{% endblock %}
{% block content %}
<h2>Settings</h2>
<p class="lead">Signed in as {{ current_user.email }}</p>

<h3 style="margin-top:20px">Change Password</h3>
<form class="stack" id="passwordForm" style="max-width:420px">
  <input type="password" id="current_password" placeholder="Current password" required>
  <input type="password" id="new_password" placeholder="New password (min. 8 characters)" required minlength="8">
  <button class="btn primary" type="submit">Update Password</button>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/settings.js') }}"></script>
{% endblock %}
